<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rei Pose Editor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #16171a, #2a2c31);
        color: #f2f2f2;
        font-family: system-ui, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: 420px;
        font-size: 12px;
        line-height: 1.6;
        color: #9a9ca3;
      }
      #hint b {
        color: #ff7100;
      }
      .lil-gui {
        --focus-color: #ff7100;
        --number-color: #ffb066;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hint">
      <b>포즈 에디터 (개발용)</b><br />
      값은 VRM 1.0 정규화 본 기준 오일러 각(도, XYZ)입니다. 0.x 모델은 자동으로 변환해서 보여 줍니다.<br />
      rest와 다른 본만 JSON으로 내보냅니다. 내보낸 파일을 <code>src/character/poses/</code>에 넣고
      <code>reactions.json</code>에 id를 추가하면 됩니다.
    </div>
    <script type="module" src="/src/tools/pose-editor/main.ts"></script>
  </body>
</html>
